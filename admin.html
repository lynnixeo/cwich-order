<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-Wich หน้าร้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column (phone first). Customer flow reads top to bottom: pick the day, pick items (with stock), delivery details, price. A second tab shows the owner's delivery board in demo mode. */
:root {
  --bg: #F5F7F1;
  --surface: #FFFFFF;
  --ink: #1C2619;
  --muted: #5C6B58;
  --line: #DDE3D6;
  --accent: #C65D00;
  --accent-ink: #FFFFFF;
  --accent-soft: #FCEBD9;
  --leaf: #2F6B3F;
  --leaf-soft: #E3EFE2;
  --warn: #B3261E;
  --font-display: "Mitr", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121712; --surface: #1B221A; --ink: #EEF2E8; --muted: #A3B09E; --line: #2E3A2C;
    --accent: #FF9A3D; --accent-ink: #1B1200; --accent-soft: #3A2A14;
    --leaf: #7FCB90; --leaf-soft: #1F3322; --warn: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121712; --surface: #1B221A; --ink: #EEF2E8; --muted: #A3B09E; --line: #2E3A2C;
  --accent: #FF9A3D; --accent-ink: #1B1200; --accent-soft: #3A2A14;
  --leaf: #7FCB90; --leaf-soft: #1F3322; --warn: #FF8A80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-inline: 16px; padding-block: 0 96px;
}
.wrap { max-width: 720px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.proto {
  margin-block: 12px 0; padding: 8px 12px; border-radius: 8px;
  background: var(--accent-soft); color: var(--ink); font-size: 13px;
}
header { padding-block: 20px 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.brand { font-family: var(--font-display); font-size: 34px; line-height: 1.1; letter-spacing: .01em; }
.brand span { color: var(--accent); }
.tagline { color: var(--muted); font-size: 14px; }

.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-block: 12px 20px; }
.tab { flex: 1; min-width: 0; padding: 10px 8px; border: 0; border-radius: 9px; background: transparent; cursor: pointer; font-weight: 500; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; background: var(--leaf-soft); color: var(--leaf); font-size: 12px; font-weight: 600; }
.tab[aria-selected="true"] .badge { background: var(--accent-ink); color: var(--accent); }

.panel { display: grid; gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.card h2 { font-size: 19px; margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.sub:empty { margin: 0; }

.duo { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 8px; border-radius: 10px; background: var(--accent-soft); }
.duo .tag { font-family: var(--font-display); font-size: 15px; color: var(--accent); white-space: nowrap; }
.duo .txt { font-size: 13px; min-width: 0; }

.group-title { font-family: var(--font-display); font-size: 13px; letter-spacing: .08em; color: var(--leaf); margin: 14px 0 4px; }
.group-title:first-of-type { margin-top: 4px; }
.item { display: flex; align-items: center; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); }
.group-title + .item { border-top: 0; }
.item .info { flex: 1; min-width: 0; }
.item .name { font-weight: 600; }
.item.out .name { color: var(--muted); }
.item .price { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.stock { font-weight: 600; color: var(--leaf); }
.stock.low { color: var(--accent); }
.stock.out { color: var(--warn); }
.stock.pre { color: var(--accent); }
.stepper { display: inline-flex; align-items: center; gap: 2px; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; line-height: 1; cursor: pointer; }
.stepper button:active { transform: scale(.96); }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper .qty { width: 34px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.item.on .qty { color: var(--accent); }

.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field label { font-weight: 600; font-size: 14px; }
.field .hint { color: var(--muted); font-size: 12px; font-weight: 400; }
input[type="text"], input[type="tel"], select, textarea {
  width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
}
textarea { min-height: 84px; resize: vertical; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 14px; }
.cols .field { margin-bottom: 0; }
.err { color: var(--warn); font-size: 13px; min-height: 1.4em; margin: 10px 0 0; }
.err.info { color: var(--muted); }

.pl { display: flex; justify-content: space-between; gap: 12px; padding-block: 6px; border-bottom: 1px dashed var(--line); font-variant-numeric: tabular-nums; }
.pl b { font-weight: 500; white-space: nowrap; }
.pl.disc b { color: var(--leaf); }
.pl.muted { color: var(--muted); }
.pl.total { border-bottom: 0; font-weight: 600; padding-top: 10px; }
.pl.total b { font-family: var(--font-display); font-size: 20px; color: var(--accent); }
.pempty { color: var(--muted); font-size: 13px; margin: 0; }

.bar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 5;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.bar .in { max-width: 720px; margin-inline: auto; display: flex; align-items: center; gap: 12px; }
.bar .tot { flex: 1; min-width: 0; }
.bar .tot b { font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.bar .tot small { display: block; color: var(--muted); font-size: 12px; }
.btn { padding: 12px 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 8px 12px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

.done h2 { color: var(--leaf); }
.done ul { margin: 10px 0 14px; padding-left: 18px; }
.done .pls { margin-bottom: 14px; }
.oid { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip small { opacity: .7; }

.make { display: grid; gap: 4px; margin: 6px 0 12px; }
.make-row { display: flex; justify-content: space-between; gap: 12px; padding-block: 6px; border-bottom: 1px dashed var(--line); }
.make-row b { font-variant-numeric: tabular-nums; }
.make-total { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.bh { font-family: var(--font-display); font-size: 14px; color: var(--leaf); margin: 12px 0 2px; }
.bh:first-child { margin-top: 0; }
pre.sumtext { margin: 12px 0 0; padding: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; font-family: var(--font-body); font-size: 13px; user-select: all; }

.day-h { font-family: var(--font-display); font-size: 15px; color: var(--leaf); margin: 4px 0 -8px; }
.order { display: grid; gap: 6px; }
.order.sent { opacity: .62; }
.order .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.order .who { font-weight: 600; }
.order .tel { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.order .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.order .time { font-family: var(--font-display); font-weight: 500; font-size: 18px; font-variant-numeric: tabular-nums; }
.order .addr { overflow-wrap: anywhere; }
.order .what { color: var(--ink); }
.order .note, .order .placed { color: var(--muted); font-size: 13px; }
.order .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
.order .sum { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); }
.pill.ok, .pill.zone { background: var(--leaf-soft); color: var(--leaf); }
.empty { color: var(--muted); text-align: center; padding: 18px 8px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<style>
.pinbox { max-width: 420px; margin: 40px auto 0; }
.row2 { display: flex; gap: 8px; }
.row2 input { flex: 1; min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.topbar .sub { margin: 0; }
.order .row .btn.done { background: var(--leaf); color: #fff; }
.order .contact { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.order.editing h3 { font-size: 17px; margin-bottom: 4px; }
.qtys { display: grid; gap: 6px; }
.qrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 400; }
.qrow input { width: 84px; text-align: center; }
input[type="date"], input[type="number"] { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .order .row .btn.done { background: var(--leaf); color: #0d1a0f; } }
</style>
<div class="wrap">
  <header>
    <h1 class="brand">C-<span>Wich</span></h1>
    <div class="tagline">หน้าร้าน: ออเดอร์ที่เข้ามา</div>
  </header>

  <section class="card pinbox" id="login">
    <h2>เข้าสู่หน้าร้าน</h2>
    <p class="sub">ใส่รหัสร้าน (ADMIN_PIN ที่ตั้งไว้ใน Apps Script)</p>
    <form id="loginForm" class="row2">
      <input type="password" id="pin" autocomplete="current-password" placeholder="รหัสร้าน" aria-label="รหัสร้าน">
      <button class="btn" type="submit" id="loginBtn">เข้า</button>
    </form>
    <p class="err" id="loginErr" role="alert"></p>
  </section>

  <main class="panel" id="board" hidden>
    <div class="topbar">
      <p class="sub" id="updated" role="status"></p>
      <div class="actions">
        <label class="toggle"><input type="checkbox" id="onlyPending" checked> แสดงเฉพาะที่ยังไม่ส่ง</label>
        <button class="btn small ghost" type="button" id="refresh">รีเฟรช</button>
        <button class="btn small ghost" type="button" id="logout">ออก</button>
      </div>
    </div>
    <p class="err" id="boardErr" role="alert"></p>
    <div class="card">
      <h2>เลือกวันที่ส่ง</h2>
      <div class="chips" id="chips"></div>
    </div>
    <div class="card">
      <h2 id="make-title">ที่ต้องทำ</h2>
      <div class="make" id="make"></div>
      <div class="make-total" id="make-total"></div>
    </div>
    <div id="orders" class="panel"></div>
  </main>
</div>

<script>
// ใส่ URL ของ Apps Script Web app (ลงท้ายด้วย /exec)
var API_URL = 'https://script.google.com/macros/s/AKfycbwe8NpmnK7J2YUmmgVbrTK9FJZM4tJh0CGsE86V21jvIeD15HskenAAoigIZvmW216ZBQ/exec';

(function () {
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function baht(n) { return '฿' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function todayKey() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function label(k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' }); }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else if (v !== undefined) localStorage.setItem(k, v); else return localStorage.getItem(k); } catch (e) { return null; } }

  var MENU_NAMES = ['ปูอัด+แฮม', 'ปูอัด+ไส้กรอก', 'ปูอัด+ไข่', 'แฮม+ไส้กรอก', 'แฮม+ไข่', 'ไส้กรอก+ไข่', 'น้ำส้ม'];
  var PRICE = { sw: 35, dr: 30, duo: 59 };
  var ZONES = { kkuic: { name: 'KKUIC', fee: 0 }, gs: { name: 'กังสดาล', fee: 5 }, mo: { name: 'หลังมอ', fee: 10 }, city: { name: 'ในเมือง', fee: 15 } };
  var pin = '', orders = [], day = 'all', busy = {}, timer = null, editing = null;

  function call(payload) {
    payload.pin = pin;
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); });
  }

  /* ---------- login ---------- */
  function showLogin(msg) {
    clearInterval(timer);
    $('board').hidden = true; $('login').hidden = false; $('loginErr').textContent = msg || '';
    $('pin').focus();
  }
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    pin = $('pin').value.trim(); if (!pin) return;
    $('loginBtn').disabled = true; $('loginErr').textContent = 'กำลังตรวจสอบ...';
    load(true).then(function (ok) {
      $('loginBtn').disabled = false;
      if (ok) { store('cw_pin', pin); $('pin').value = ''; }
    });
  });
  $('logout').addEventListener('click', function () { store('cw_pin', null); pin = ''; orders = []; showLogin(''); });

  /* ---------- load ---------- */
  function load(fromLogin) {
    return call({ action: 'admin_orders' }).then(function (res) {
      if (!res || !res.ok) {
        if (res && (res.error === 'BAD_PIN' || res.error === 'NO_PIN')) { store('cw_pin', null); showLogin(res.message); }
        else if (fromLogin) $('loginErr').textContent = (res && res.message) || 'โหลดไม่ได้ ลองใหม่อีกครั้ง';
        else $('boardErr').textContent = (res && res.message) || 'โหลดไม่ได้ ลองใหม่อีกครั้ง';
        return false;
      }
      orders = res.orders || [];
      $('boardErr').textContent = '';
      var t = new Date(); $('updated').textContent = 'อัปเดตล่าสุด ' + pad2(t.getHours()) + ':' + pad2(t.getMinutes()) + ' น.';
      if (fromLogin) {
        $('login').hidden = true; $('board').hidden = false;
        day = hasDay(todayKey()) ? todayKey() : 'all';
        clearInterval(timer); timer = setInterval(function () { if (!document.hidden && !editing) load(); }, 60000);
      }
      render();
      return true;
    }).catch(function () {
      var m = 'เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่';
      if (fromLogin) $('loginErr').textContent = m; else $('boardErr').textContent = m;
      return false;
    });
  }
  function hasDay(k) { return orders.some(function (o) { return o.date === k; }); }
  $('refresh').addEventListener('click', function () { if (editing) { $('boardErr').textContent = 'กำลังแก้ไขออเดอร์อยู่ กดบันทึกหรือยกเลิกก่อน'; return; } load(); });

  /* ---------- render ---------- */
  function parseItems(s) {
    var out = [];
    String(s || '').split(', ').forEach(function (p) {
      var m = p.match(/^(.*) × (\d+)$/); if (m) out.push({ name: m[1], qty: Number(m[2]) });
    });
    return out;
  }
  function visible() {
    var only = $('onlyPending').checked;
    return orders.filter(function (o) { return (day === 'all' || o.date === day) && (!only || !o.sent); })
      .sort(function (a, b) { return a.date !== b.date ? (a.date < b.date ? -1 : 1) : (a.time !== b.time ? (a.time < b.time ? -1 : 1) : (a.id < b.id ? -1 : 1)); });
  }
  function render() {
    var days = []; orders.forEach(function (o) { if (o.date && days.indexOf(o.date) < 0) days.push(o.date); });
    days.sort();
    if (day !== 'all' && days.indexOf(day) < 0) day = 'all';
    var pendAll = orders.filter(function (o) { return !o.sent; }).length;
    var chips = '<button class="chip" type="button" data-day="all" aria-pressed="' + (day === 'all') + '">ทั้งหมด <small>' + pendAll + ' รอส่ง</small></button>';
    days.slice(-14).forEach(function (d) {
      var n = orders.filter(function (o) { return o.date === d && !o.sent; }).length;
      chips += '<button class="chip" type="button" data-day="' + d + '" aria-pressed="' + (day === d) + '">' + esc(label(d)) + (d === todayKey() ? ' (วันนี้)' : '') + ' <small>' + n + ' รอส่ง</small></button>';
    });
    $('chips').innerHTML = chips;

    var list = visible(), totals = {}, pieces = 0, money = 0;
    list.forEach(function (o) { money += o.total; parseItems(o.items).forEach(function (it) { totals[it.name] = (totals[it.name] || 0) + it.qty; pieces += it.qty; }); });
    $('make-title').textContent = 'ที่ต้องทำ' + (day === 'all' ? 'ทั้งหมด' : ' ' + label(day)) + ($('onlyPending').checked ? ' (ที่ยังไม่ส่ง)' : '');
    var names = Object.keys(totals);
    $('make').innerHTML = names.length ? names.map(function (n) { return '<div class="make-row"><span>' + esc(n) + '</span><b>' + totals[n] + ' ชิ้น</b></div>'; }).join('') : '<div class="empty">ไม่มีออเดอร์ที่รอส่ง</div>';
    $('make-total').innerHTML = '<span>' + list.length + ' ออเดอร์</span><span>รวม ' + pieces + ' ชิ้น</span><span>ยอดรวม ' + baht(money) + '</span>';

    var html = '', last = '';
    list.forEach(function (o) {
      if (o.date !== last) { html += '<div class="day-h">ส่ง ' + esc(o.date ? label(o.date) : '-') + '</div>'; last = o.date; }
      if (editing === o.id) { html += editorHtml(o); return; }
      html += '<div class="card order' + (o.sent ? ' sent' : '') + '" data-id="' + esc(o.id) + '">' +
        '<div class="meta"><b class="time">' + esc(o.time) + ' น.</b><span class="pill zone">' + esc(o.zone) + '</span><span class="tel">' + esc(o.id) + '</span></div>' +
        '<div class="top"><span class="who">' + esc(o.name) + '</span></div>' +
        '<div class="contact">ติดต่อ: ' + esc(o.contact) + '</div>' +
        '<div class="addr">' + esc(o.addr) + '</div>' +
        '<div class="what">' + esc(o.items) + '</div>' +
        (o.note ? '<div class="note">หมายเหตุ: ' + esc(o.note) + '</div>' : '') +
        '<div class="placed">สั่งเมื่อ ' + esc(o.placed) + '</div>' +
        '<div class="row"><span class="sum">' + baht(o.total) + ' (ค่าส่ง ' + baht(o.fee) + ') · ' + (o.sent ? '<span class="pill ok">ส่งแล้ว</span>' : '<span class="pill">รอส่ง</span>') + '</span>' +
        '<span class="actions"><button class="btn small ghost" type="button" data-act="edit"' + (busy[o.id] || editing ? ' disabled' : '') + '>แก้ไข</button>' +
        '<button class="btn small' + (o.sent ? ' ghost' : ' done') + '" type="button" data-act="toggle"' + (busy[o.id] ? ' disabled' : '') + '>' + (busy[o.id] ? 'กำลังบันทึก...' : (o.sent ? 'ยกเลิกสถานะส่งแล้ว' : '✓ ส่งแล้ว')) + '</button></span></div></div>';
    });
    $('orders').innerHTML = html || '<div class="card empty">ไม่มีออเดอร์ในตัวกรองนี้</div>';
  }
  $('chips').addEventListener('click', function (e) { var b = e.target.closest('.chip'); if (!b) return; day = b.getAttribute('data-day'); render(); });
  $('onlyPending').addEventListener('change', render);

  /* ---------- edit an order ---------- */
  function editorHtml(o) {
    var qty = {}; parseItems(o.items).forEach(function (it) { qty[it.name] = it.qty; });
    var times = [], cur = o.time;
    for (var h = 9; h <= 21; h++) ['00', '30'].forEach(function (m) { if (!(h === 21 && m === '30')) times.push(pad2(h) + ':' + m); });
    if (cur && times.indexOf(cur) < 0) times.push(cur);
    var zoneId = o.zoneId || '';
    return '<div class="card order editing" data-id="' + esc(o.id) + '">' +
      '<h3>แก้ไขออเดอร์ ' + esc(o.id) + '</h3>' +
      '<div class="cols">' +
      '<div class="field"><label for="ed-date">วันที่ส่ง</label><input type="date" id="ed-date" class="ed" value="' + esc(o.date) + '"></div>' +
      '<div class="field"><label for="ed-time">เวลาส่ง</label><select id="ed-time" class="ed">' + times.map(function (t) { return '<option value="' + t + '"' + (t === cur ? ' selected' : '') + '>' + t + ' น.</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="ed-zone">พื้นที่</label><select id="ed-zone" class="ed">' + Object.keys(ZONES).map(function (z) { return '<option value="' + z + '"' + (z === zoneId ? ' selected' : '') + '>' + esc(ZONES[z].name) + (ZONES[z].fee ? ' (+' + ZONES[z].fee + ')' : ' (ไม่มีค่าส่ง)') + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="ed-name">ชื่อ</label><input type="text" id="ed-name" class="ed" value="' + esc(o.name) + '"></div>' +
      '<div class="field"><label for="ed-contact">ช่องทางติดต่อ</label><input type="text" id="ed-contact" class="ed" maxlength="60" value="' + esc(o.contact) + '"></div>' +
      '</div>' +
      '<div class="field"><label for="ed-addr">ที่อยู่</label><textarea id="ed-addr" class="ed">' + esc(o.addr) + '</textarea></div>' +
      '<div class="field"><label for="ed-note">หมายเหตุ</label><input type="text" id="ed-note" class="ed" value="' + esc(o.note) + '"></div>' +
      '<div class="field"><label>จำนวน</label><div class="qtys">' + MENU_NAMES.map(function (n, i) {
        return '<label class="qrow"><span>' + esc(n) + '</span><input type="number" class="ed qty-in" data-name="' + esc(n) + '" min="0" max="99" inputmode="numeric" value="' + (qty[n] || 0) + '"></label>';
      }).join('') + '</div></div>' +
      '<div class="make-row net"><span>ยอดรวมใหม่</span><b id="ed-total">-</b></div>' +
      '<p class="err" id="ed-err" role="alert"></p>' +
      '<div class="actions"><button class="btn small" type="button" data-act="save">บันทึกการแก้ไข</button><button class="btn small ghost" type="button" data-act="cancel">ยกเลิก</button></div>' +
      '<p class="sub" style="margin:8px 0 0">เมื่อบันทึก ระบบคิดราคาใหม่ แก้แถวในชีต และแจ้งไลน์ว่ามีการแก้ไข</p></div>';
  }
  function readEditor() {
    var items = {};
    [].forEach.call(document.querySelectorAll('.qty-in'), function (i) { var q = parseInt(i.value, 10); if (q > 0) items[i.getAttribute('data-name')] = Math.min(q, 99); });
    return { date: $('ed-date').value, time: $('ed-time').value, zone: $('ed-zone').value, name: $('ed-name').value.trim(), phone: $('ed-contact').value.trim(), addr: $('ed-addr').value.trim(), note: $('ed-note').value.trim(), items: items };
  }
  function previewTotal() {
    var el = $('ed-total'); if (!el) return;
    var d = readEditor(), sw = 0, dr = 0;
    Object.keys(d.items).forEach(function (n) { if (n === 'น้ำส้ม') dr += d.items[n]; else sw += d.items[n]; });
    if (!sw && !dr) { el.textContent = 'ยังไม่ได้เลือกสินค้า'; return; }
    var total = sw * PRICE.sw + dr * PRICE.dr - Math.min(sw, dr) * (PRICE.sw + PRICE.dr - PRICE.duo) + (ZONES[d.zone] ? ZONES[d.zone].fee : 0);
    el.textContent = baht(total);
  }
  $('orders').addEventListener('input', function (e) { if (e.target.classList.contains('ed')) previewTotal(); });
  $('orders').addEventListener('change', function (e) { if (e.target.classList.contains('ed')) previewTotal(); });

  $('orders').addEventListener('click', function (e) {
    var a = e.target.closest('button[data-act]');
    if (a && a.getAttribute('data-act') === 'edit' && !a.disabled) {
      editing = a.closest('.order').getAttribute('data-id'); $('boardErr').textContent = ''; render(); previewTotal();
      var f = $('ed-name'); if (f) f.focus();
      return;
    }
    if (a && a.getAttribute('data-act') === 'cancel') { editing = null; render(); return; }
    if (a && a.getAttribute('data-act') === 'save' && !a.disabled) {
      var id = editing, d = readEditor(); d.action = 'admin_edit'; d.id = id;
      if (!Object.keys(d.items).length) { $('ed-err').textContent = 'ใส่จำนวนอย่างน้อย 1 รายการ'; return; }
      a.disabled = true; $('ed-err').textContent = 'กำลังบันทึก...';
      call(d).then(function (res) {
        if (res && res.ok && res.order) {
          orders = orders.map(function (x) { return x.id === id ? res.order : x; });
          editing = null;
          if (day !== 'all') day = res.order.date || 'all';
          render();
        } else {
          a.disabled = false; $('ed-err').textContent = (res && res.message) || 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';
          if (res && res.error === 'BAD_PIN') { store('cw_pin', null); showLogin(res.message); }
        }
      }).catch(function () { a.disabled = false; $('ed-err').textContent = 'เชื่อมต่อไม่ได้ ยังไม่ได้บันทึก ลองใหม่อีกครั้ง'; });
      return;
    }
    var b = e.target.closest('button[data-act="toggle"]'); if (!b || b.disabled) return;
    var id = b.closest('.order').getAttribute('data-id');
    var o = orders.filter(function (x) { return x.id === id; })[0]; if (!o || busy[id]) return;
    var want = !o.sent;
    busy[id] = true; render();
    call({ action: 'admin_status', id: id, sent: want }).then(function (res) {
      delete busy[id];
      if (res && res.ok) { o.sent = want; $('boardErr').textContent = ''; }
      else $('boardErr').textContent = (res && res.message) || 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';
      render();
    }).catch(function () { delete busy[id]; $('boardErr').textContent = 'เชื่อมต่อไม่ได้ ยังไม่ได้บันทึก ลองใหม่อีกครั้ง'; render(); });
  });

  /* ---------- start ---------- */
  var saved = store('cw_pin');
  if (saved) { pin = saved; $('login').hidden = true; load(true).then(function (ok) { if (!ok && $('board').hidden) $('login').hidden = false; }); }
  else showLogin('');
})();
</script>

</body>
</html>
